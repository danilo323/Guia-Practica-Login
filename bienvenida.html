<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CITRA | Bienvenido</title>
    <link rel="icon" type="image/png" href="img/favicon.png">

    <!-- Si no hay sesión iniciada, vuelve al login -->
    <script>
        if (!sessionStorage.getItem('sesion')) {
            window.location.replace('index.html');
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

    <!-- Reutiliza la paleta y el fondo de la página de login -->
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            align-items: center !important;
        }

        .welcome-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            text-align: center;
            animation: aparecer 0.8s ease both;
        }

        .welcome-page img {
            width: 140px;
            filter: drop-shadow(0 10px 30px rgba(255, 137, 4, 0.35));
        }

        .welcome-page h1 {
            font-size: clamp(2.5rem, 10vw, 6rem);
            font-weight: 900;
            letter-spacing: 4px;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: none; }
        }
    </style>
</head>
<body>
    <main class="welcome-page">
        <img src="img/citra-icono.png" alt="Logo de CITRA">
        <h1>BIENVENIDO</h1>
    </main>
</body>
</html>
